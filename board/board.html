<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시판 - 프린터모아</title>
  <meta name="description" content="프린터모아 공지사항, 상담게시판, 사용후기">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../auth.js"></script>
  <script src="board.js"></script>
</head>
<body class="board-page">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="container">
      <div class="inner">
        <div class="top-search" style="visibility:hidden;"></div>

        <a href="../index.html" class="logo" id="boardLogo">
          <div class="logo-text">프린터<span>모아</span></div>
        </a>

        <div class="top-phone">
          <div class="phone-info-block">
            <div class="label">상담 전화</div>
            <a href="tel:01059223650" class="number">010-5922-3650</a>
          </div>
          <div class="auth-nav-area">
            <!-- 대시보드 진입 버튼 (특정 구글 이메일 로그인 시만 표시) -->
            <a href="../dashboard/index.html" id="dashboardAccessBtn" title="관리자 대시보드">
              <i class="fa fa-tachometer-alt"></i> OP Board
            </a>
            <span class="header-user-name" id="headerUserName" style="display:none"></span>
            <!-- 구글 로그인 버튼 (비로그인 상태에서만 표시) -->
            <a href="../login.html" class="header-google-btn" id="headerGoogleShortcut" style="display:none">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
              <span>Google 로그인</span>
            </a>
            <button class="header-auth-btn logout" id="headerLogoutBtn" style="display:none">로그아웃</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- GNB -->
  <nav class="gnb">
    <div class="container">
      <div class="gnb-menu">
        <ul>
          <li><a href="../index.html">홈</a></li>
          <li><a href="board.html?type=notice" id="gnbNotice">공지사항</a></li>
          <li><a href="board.html?type=consult" id="gnbConsult">상담게시판</a></li>
          <li><a href="board.html?type=review" id="gnbReview">사용후기</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 게시판 본문 -->
  <div class="board-content">

    <!-- 게시판 탭 -->
    <div class="board-tabs">
      <button class="board-tab" id="tabNotice" data-type="notice" onclick="switchTab('notice')">
        📢 공지사항
      </button>
      <button class="board-tab" id="tabConsult" data-type="consult" onclick="switchTab('consult')">
        💬 상담게시판
      </button>
      <button class="board-tab" id="tabReview" data-type="review" onclick="switchTab('review')">
        ⭐ 사용후기
      </button>
      <button class="board-tab" id="tabRequest" data-type="request" onclick="switchTab('request')" style="display:none; color:#4f46e5; font-weight:700;">
        📞 전화상담신청 (관리자)
      </button>
    </div>

    <!-- 게시판 헤더 -->
    <div class="board-header">
      <h2 class="board-title" id="boardTitle">공지사항</h2>
      <button class="board-write-btn" id="writeBtn" onclick="goWrite()">
        <i class="fa fa-pen"></i> 글쓰기
      </button>
    </div>

    <!-- 게시글 목록 테이블 -->
    <div class="board-table-wrap">
      <table class="board-table" id="boardTable">
        <thead>
          <tr>
            <th style="width:60px;">번호</th>
            <th class="title-col">제목</th>
            <th style="width:100px;">작성자</th>
            <th style="width:110px;">작성일</th>
            <th style="width:70px;">조회</th>
          </tr>
        </thead>
        <tbody id="boardTbody">
          <!-- JS로 동적 렌더링 -->
        </tbody>
      </table>
    </div>

    <!-- 빈 게시판 메시지 (초기 숨김) -->
    <div class="board-empty" id="boardEmpty" style="display:none">
      <i class="fa fa-inbox" style="font-size:36px; margin-bottom:12px; color:#ccc;"></i>
      <p>등록된 게시글이 없습니다.</p>
    </div>

    <!-- 페이지네이션 -->
    <div class="pagination" id="pagination"></div>

  </div>

  <!-- FOOTER -->
  <footer class="footer" style="margin-top: 60px;">
    <div class="container">
      <div class="footer-links">
        <a href="../index.html" class="bold">홈</a>
        <a href="board.html?type=notice">공지사항</a>
        <a href="board.html?type=consult">상담게시판</a>
        <a href="board.html?type=review">사용후기</a>
      </div>
      <p class="footer-company">프린터모아</p>
      <div class="footer-info">
        주소 : 서울 강동구 아리수로64길 11 1층 렌탈사무기<br>
        전화 : 010-5922-3650
      </div>
      <div class="footer-copyright">Copyright © 프린터모아. All Rights Reserved.</div>
    </div>
  </footer>

  <script>
    // ── 현재 상태 변수 ─────────────────────────────
    let currentType = 'notice';
    let currentPage = 1;
    const PAGE_SIZE = 10;

    // ── 초기화 ──────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      Auth.updateHeaderUI();

      // 대시보드 버튼 및 구글 간편 로그인 버튼 표시 제어
      const dashBtn = document.getElementById('dashboardAccessBtn');
      const googleShortcut = document.getElementById('headerGoogleShortcut');
      const tabRequest = document.getElementById('tabRequest');

      if (Auth.isDashboardAdmin() && dashBtn) dashBtn.style.display = 'inline-flex';
      if (!Auth.isLoggedIn() && googleShortcut) googleShortcut.style.display = 'inline-flex';

      // 관리자일 때만 전화상담신청 게시판 탭 노출
      if (Auth.isAdmin() && tabRequest) {
        tabRequest.style.display = 'inline-block';
      }

      // URL 파라미터에서 게시판 타입 읽기
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type') || 'notice';
      switchTab(type);
    });

    // ── 탭 전환 ─────────────────────────────────────
    function switchTab(type) {
      // 전화상담신청 게시판은 오직 관리자만 접근 가능
      if (type === 'request' && !Auth.isAdmin()) {
        alert('전화상담신청 내역은 관리자만 열람할 수 있습니다.');
        type = 'notice';
      }

      currentType = type;
      currentPage = 1;

      // 탭 활성화 스타일
      ['notice', 'consult', 'review', 'request'].forEach(t => {
        const tab = document.getElementById(`tab${capitalize(t)}`);
        if (tab) tab.classList.toggle('active', t === type);
      });

      // GNB 활성화
      ['Notice', 'Consult', 'Review'].forEach(t => {
        const el = document.getElementById(`gnb${t}`);
        if (el) el.style.fontWeight = t.toLowerCase() === type ? '700' : '';
      });

      // 게시판 제목 업데이트
      document.getElementById('boardTitle').textContent = Board.getBoardName(type);

      // 글쓰기 버튼 제어:
      // - 공지사항: 관리자만 표시
      // - 전화상담신청: 글쓰기 숨김 (메인페이지 하단 폼 접수용)
      // - 상담/후기: 표시
      const writeBtn = document.getElementById('writeBtn');
      if (writeBtn) {
        if (type === 'notice') {
          writeBtn.style.display = Auth.isAdmin() ? 'inline-flex' : 'none';
        } else if (type === 'request') {
          writeBtn.style.display = 'none';
        } else {
          writeBtn.style.display = 'inline-flex';
        }
      }

      // URL 업데이트 (새로고침 없이)
      history.replaceState(null, '', `?type=${type}`);

      // 게시글 렌더링
      renderPosts();
    }

    // ── 게시글 목록 렌더링 ──────────────────────────
    function renderPosts() {
      const posts = Board.getPostsByType(currentType);
      const tbody = document.getElementById('boardTbody');
      const emptyEl = document.getElementById('boardEmpty');
      const tableWrap = document.querySelector('.board-table-wrap');

      // 비회원도 목록(게시글 리스트)은 모두 볼 수 있도록 허용

      if (posts.length === 0) {
        tableWrap.style.display = 'none';
        emptyEl.innerHTML = `
          <i class="fa fa-inbox" style="font-size:36px; margin-bottom:12px; color:#ccc;"></i>
          <p>등록된 게시글이 없습니다.</p>
        `;
        emptyEl.style.display = 'block';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      tableWrap.style.display = 'block';
      emptyEl.style.display = 'none';

      // 페이지네이션 계산
      const total = posts.length;
      const totalPages = Math.ceil(total / PAGE_SIZE);
      const start = (currentPage - 1) * PAGE_SIZE;
      const pagePosts = posts.slice(start, start + PAGE_SIZE);

      // 행 렌더링
      tbody.innerHTML = pagePosts.map((post, idx) => {
        const num = total - start - idx;
        const badge = post.isPinned
          ? `<span class="pinned-badge">공지</span>`
          : (currentType !== 'notice' ? '' : `<span class="notice-badge">${num}</span>`);
        
        // 상담게시판은 비밀글 아이콘 및 작성자 마스킹 적용
        const lockIcon = currentType === 'consult' ? `<i class="fa fa-lock" style="color:#0099cc; margin-right:5px; font-size:13px;" title="비밀글"></i>` : '';
        const authorDisplay = currentType === 'consult' ? maskAuthor(post.author) : escapeHtml(post.author);

        // 전화상담신청 상태 배지 (접수대기 / 상담완료)
        let statusBadge = '';
        if (currentType === 'request') {
          const st = post.status || '접수대기';
          statusBadge = st === '상담완료'
            ? `<span style="background:#dcfce7; color:#15803d; padding:3px 8px; border-radius:12px; font-size:11px; font-weight:700; margin-left:6px;">상담완료</span>`
            : `<span style="background:#ffedd5; color:#c2410c; padding:3px 8px; border-radius:12px; font-size:11px; font-weight:700; margin-left:6px;">접수대기</span>`;
        }

        return `
          <tr onclick="goView('${post.id}')" style="cursor:pointer;">
            <td>${post.isPinned ? '📌' : num}</td>
            <td class="title-col">
              <span class="post-title-link">${badge}${lockIcon}${escapeHtml(post.title)}${statusBadge}</span>
            </td>
            <td>${authorDisplay}</td>
            <td>${Board.formatDate(post.createdAt)}</td>
            <td>${post.views || 0}</td>
          </tr>
        `;
      }).join('');

      // 페이지네이션 렌더링
      renderPagination(totalPages);
    }

    // ── 페이지네이션 ────────────────────────────────
    function renderPagination(totalPages) {
      const el = document.getElementById('pagination');
      if (totalPages <= 1) { el.innerHTML = ''; return; }

      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      el.innerHTML = html;
    }

    function goPage(page) {
      currentPage = page;
      renderPosts();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ── 게시글 상세 이동 (권한 검사) ────────────────────
    function goView(id) {
      const post = Board.getPost(id);
      if (!post) {
        alert('게시글을 찾을 수 없습니다.');
        return;
      }

      // 1. 공지사항 & 사용후기: 비회원도 누구나 본문 열람 가능
      if (currentType === 'notice' || currentType === 'review') {
        window.location.href = `board-view.html?id=${id}&type=${currentType}`;
        return;
      }

      // 2. 전화상담신청: 오직 관리자 3명만 상세 열람 가능
      if (currentType === 'request') {
        if (!Auth.isAdmin()) {
          alert('전화상담신청 내역은 관리자만 열람할 수 있습니다.');
          return;
        }
        window.location.href = `board-view.html?id=${id}&type=${currentType}`;
        return;
      }

      // 3. 상담게시판: 비회원은 로그인 안내 후 구글 로그인 창으로 이동
      if (currentType === 'consult') {
        if (!Auth.isLoggedIn()) {
          alert('로그인이 필요한 서비스입니다.');
          window.location.href = '../login.html?redirect=' + encodeURIComponent(`board/board-view.html?id=${id}&type=${currentType}`);
          return;
        }

        // 로그인 회원 중 작성자 본인 또는 관리자 3명만 상세 열람 가능
        if (!Auth.canViewConsultPost(post)) {
          alert('비밀글은 작성자와 관리자만 열람할 수 있습니다.');
          return;
        }
      }

      // 권한 통과 시 상세 페이지로 이동
      window.location.href = `board-view.html?id=${id}&type=${currentType}`;
    }

    // ── 글쓰기 이동 ─────────────────────────────────
    function goWrite() {
      // 1. 공지사항: 오직 관리자 3개 아이디만 작성 가능
      if (currentType === 'notice') {
        if (!Auth.isAdmin()) {
          alert('공지사항은 관리자만 작성할 수 있습니다.');
          return;
        }
        window.location.href = `board-write.html?type=notice`;
        return;
      }

      // 2. 전화상담신청: 메인페이지 하단 폼으로 자동 등록되므로 수동 글쓰기 없음
      if (currentType === 'request') {
        alert('전화상담신청은 메인페이지 하단 상담 신청란을 통해 자동으로 접수됩니다.');
        return;
      }

      // 3. 상담게시판 / 사용후기: 비로그인 시 로그인 안내 및 구글 로그인 창 이동
      if (!Auth.isLoggedIn()) {
        alert('로그인이 필요한 서비스입니다.');
        window.location.href = '../login.html?redirect=' + encodeURIComponent(`board/board-write.html?type=${currentType}`);
        return;
      }

      window.location.href = `board-write.html?type=${currentType}`;
    }

    // ── 작성자 마스킹 (홍길동 -> 홍*동) ─────────────
    function maskAuthor(name) {
      if (!name) return '익명';
      if (name.length <= 1) return name;
      if (name.length === 2) return name[0] + '*';
      return name[0] + '*'.repeat(name.length - 2) + name[name.length - 1];
    }

    // ── 유틸: 첫 글자 대문자 ────────────────────────
    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // ── 유틸: HTML 이스케이프 (XSS 방지) ───────────
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 보기 - 프린터모아</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../auth.js"></script>
  <script src="board.js"></script>
</head>
<body class="board-page">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="container">
      <div class="inner">
        <div></div>
        <a href="../index.html" class="logo">
          <div class="logo-text">프린터<span>모아</span></div>
        </a>
        <div class="top-phone">
          <div class="phone-info-block">
            <div class="label">상담 전화</div>
            <a href="tel:01059223650" class="number">010-5922-3650</a>
          </div>
          <div class="auth-nav-area">
            <a href="../dashboard/index.html" id="dashboardAccessBtn" title="관리자 대시보드">
              <i class="fa fa-tachometer-alt"></i> OP Board
            </a>
            <span class="header-user-name" id="headerUserName" style="display:none"></span>
            <a href="../login.html" class="header-google-btn" id="headerGoogleShortcut" style="display:none">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
              <span>Google 로그인</span>
            </a>
            <button class="header-auth-btn logout" id="headerLogoutBtn" style="display:none">로그아웃</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- GNB -->
  <nav class="gnb">
    <div class="container">
      <div class="gnb-menu">
        <ul>
          <li><a href="../index.html">홈</a></li>
          <li><a href="board.html?type=notice">공지사항</a></li>
          <li><a href="board.html?type=consult">상담게시판</a></li>
          <li><a href="board.html?type=review">사용후기</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 게시글 상세 -->
  <div class="board-content">

    <!-- 게시글 내용 박스 -->
    <div class="post-detail" id="postDetail">
      <!-- JS로 채워짐 -->
    </div>

  </div>

  <!-- FOOTER -->
  <footer class="footer" style="margin-top:60px;">
    <div class="container">
      <div class="footer-links">
        <a href="../index.html" class="bold">홈</a>
        <a href="board.html?type=notice">공지사항</a>
        <a href="board.html?type=consult">상담게시판</a>
        <a href="board.html?type=review">사용후기</a>
      </div>
      <p class="footer-company">프린터모아</p>
      <div class="footer-copyright">Copyright © 프린터모아. All Rights Reserved.</div>
    </div>
  </footer>

  <script>
    let currentPost = null;
    let currentType = 'notice';

    document.addEventListener('DOMContentLoaded', () => {
      Auth.updateHeaderUI();

      // 대시보드 버튼 및 구글 로그인 단축 버튼 표시
      const dashBtn = document.getElementById('dashboardAccessBtn');
      const googleShortcut = document.getElementById('headerGoogleShortcut');
      if (Auth.isDashboardAdmin() && dashBtn) dashBtn.style.display = 'inline-flex';
      if (!Auth.isLoggedIn() && googleShortcut) googleShortcut.style.display = 'inline-flex';

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      currentType = params.get('type') || 'notice';

      if (!id) {
        window.location.href = `board.html?type=${currentType}`;
        return;
      }

      // 게시글 조회 (조회수 증가)
      currentPost = Board.getPost(id, true);

      if (!currentPost) {
        document.getElementById('postDetail').innerHTML = `
          <div class="board-empty">
            <p>게시글을 찾을 수 없습니다.</p>
            <a href="board.html?type=${currentType}" class="post-btn list-btn" style="margin-top:16px; display:inline-flex;">
              목록으로
            </a>
          </div>
        `;
        return;
      }

      // ── 접근 권한 검사 ──
      // 1. 공지사항 & 사용후기: 누구나 열람 가능 (비회원 포함)

      // 2. 전화상담신청: 오직 관리자 3명만 열람 가능
      if (currentPost.boardType === 'request') {
        if (!Auth.isAdmin()) {
          alert('전화상담신청 내역은 관리자만 열람할 수 있습니다.');
          window.location.href = `board.html?type=notice`;
          return;
        }
      }

      // 3. 상담게시판: 비로그인은 로그인창 이동, 일반회원은 작성자 본인 또는 관리자 3명만 열람
      if (currentPost.boardType === 'consult') {
        if (!Auth.isLoggedIn()) {
          alert('로그인이 필요한 서비스입니다.');
          window.location.href = '../login.html?redirect=' + encodeURIComponent(`board/board-view.html?id=${id}&type=${currentType}`);
          return;
        }
        if (!Auth.canViewConsultPost(currentPost)) {
          document.getElementById('postDetail').innerHTML = `
            <div class="board-empty">
              <i class="fa fa-lock" style="font-size:36px; margin-bottom:12px; color:#0099cc;"></i>
              <p style="font-weight:600; margin-bottom:8px;">비밀글 접근 권한이 없습니다</p>
              <p style="color:#888; font-size:13px; margin-bottom:16px;">상담게시판의 글은 작성자 본인과 관리자만 열람할 수 있습니다.</p>
              <a href="board.html?type=${currentPost.boardType}" class="post-btn list-btn" style="margin-top:8px; display:inline-flex;">목록으로</a>
            </div>
          `;
          return;
        }
      }

      // 페이지 타이틀 업데이트
      document.title = `${currentPost.title} - 프린터모아`;

      renderPost();
    });

    // ── 게시글 렌더링 ────────────────────────────────
    function renderPost() {
      const user = Auth.getCurrentUser();
      
      // 수정/삭제 버튼 노출 여부:
      // - 공지사항 & 전화상담신청: 오직 관리자 3명(Auth.isAdmin())만 가능
      // - 상담/후기: 작성자 본인(ID 또는 이메일 일치) 또는 관리자 3명
      let canEdit = false;
      if (currentPost.boardType === 'notice' || currentPost.boardType === 'request') {
        canEdit = Auth.isAdmin();
      } else {
        canEdit = user && (
          Auth.isAdmin() ||
          (currentPost.userId && user.id === currentPost.userId) ||
          (currentPost.authorEmail && user.email && currentPost.authorEmail === user.email)
        );
      }

      const updatedText = currentPost.updatedAt
        ? `<span> · 수정됨: ${Board.formatDate(currentPost.updatedAt)}</span>`
        : '';

      // 상태 변경 버튼 (전화상담신청 게시글 전용)
      let statusToggleBtn = '';
      if (currentPost.boardType === 'request' && Auth.isAdmin()) {
        const isDone = currentPost.status === '상담완료';
        statusToggleBtn = `
          <button class="post-btn" onclick="toggleRequestStatus()" style="background:${isDone ? '#f59e0b' : '#10b981'}; color:#fff; font-weight:700;">
            <i class="fa ${isDone ? 'fa-undo' : 'fa-check'}"></i> ${isDone ? '접수대기로 변경' : '상담완료 처리'}
          </button>
        `;
      }

      const actionBtns = canEdit ? `
        <div style="display:flex; gap:10px;">
          ${statusToggleBtn}
          <button class="post-btn edit-btn" id="editBtn" onclick="goEdit()">
            <i class="fa fa-edit"></i> 수정
          </button>
          <button class="post-btn delete-btn" id="deleteBtn" onclick="doDelete()">
            <i class="fa fa-trash"></i> 삭제
          </button>
        </div>
      ` : '<div></div>';

      document.getElementById('postDetail').innerHTML = `
        <div class="post-detail-header">
          <p class="post-detail-board">
            <a href="board.html?type=${currentPost.boardType}" style="color:var(--primary);">
              ${Board.getBoardName(currentPost.boardType)}
            </a>
          </p>
          <h1 class="post-detail-title">${escapeHtml(currentPost.title)}</h1>
          <div class="post-detail-meta">
            <span><i class="fa fa-user" style="margin-right:4px;"></i>${escapeHtml(currentPost.author)}</span>
            <span><i class="fa fa-calendar" style="margin-right:4px;"></i>${Board.formatDate(currentPost.createdAt)}${updatedText}</span>
            <span><i class="fa fa-eye" style="margin-right:4px;"></i>조회 ${currentPost.views}</span>
          </div>
        </div>

        <div class="post-detail-body">${escapeHtml(currentPost.content)}</div>

        <div class="post-detail-actions">
          <a href="board.html?type=${currentPost.boardType}" class="post-btn list-btn">
            <i class="fa fa-list"></i> 목록
          </a>
          ${actionBtns}
        </div>
      `;
    }

    // ── 전화상담신청 상태 토글 (관리자 전용) ──────────────
    function toggleRequestStatus() {
      if (!Auth.isAdmin()) return;
      const newStatus = currentPost.status === '상담완료' ? '접수대기' : '상담완료';
      const all = Board.getAllPosts();
      const idx = all.findIndex(p => p.id === currentPost.id);
      if (idx !== -1) {
        all[idx].status = newStatus;
        if (!all[idx].content.includes('상태:')) {
          all[idx].content += `\n상태: ${newStatus}`;
        } else {
          all[idx].content = all[idx].content.replace(/상태:.*/, `상태: ${newStatus}`);
        }
        all[idx].updatedAt = new Date().toISOString();
        localStorage.setItem('pm_board_posts', JSON.stringify(all));
        alert(`상태가 [${newStatus}]로 변경되었습니다.`);
        location.reload();
      }
    }

    // ── 수정 페이지 이동 ───────────────────────────────
    function goEdit() {
      // 공지사항 및 전화상담신청은 관리자만 수정 가능
      if ((currentPost.boardType === 'notice' || currentPost.boardType === 'request') && !Auth.isAdmin()) {
        alert('관리자만 수정할 수 있습니다.');
        return;
      }

      // 상담게시판/사용후기는 구글 실제 수정 작업도 구글 로그인 필수
      if ((currentPost.boardType === 'consult' || currentPost.boardType === 'review') && !Auth.isGoogleUser()) {
        if (confirm('수정하려면 구글 계정으로 로그인이 필요합니다.\n구글 로그인 페이지로 이동하시겠습니까?')) {
          window.location.href = '../login.html?redirect=' + encodeURIComponent(window.location.href);
        }
        return;
      }
      window.location.href = `board-write.html?id=${currentPost.id}&type=${currentPost.boardType}`;
    }

    // ── 삭제 처리 ──────────────────────────────────
    function doDelete() {
      const user = Auth.getCurrentUser();
      if (!user) { alert('로그인이 필요합니다.'); return; }

      // 공지사항 및 전화상담신청은 관리자만 삭제 가능
      if ((currentPost.boardType === 'notice' || currentPost.boardType === 'request') && !Auth.isAdmin()) {
        alert('관리자만 삭제할 수 있습니다.');
        return;
      }

      // 상담게시판/사용후기는 구글 로그인 사용자만 삭제 가능
      if ((currentPost.boardType === 'consult' || currentPost.boardType === 'review') && !Auth.isGoogleUser()) {
        if (confirm('삭제하려면 구글 계정으로 로그인이 필요합니다.\n구글 로그인 페이지로 이동하시겠습니까?')) {
          window.location.href = '../login.html?redirect=' + encodeURIComponent(window.location.href);
        }
        return;
      }

      if (!confirm('정말 이 게시글을 삭제하시겠습니까?')) return;

      const result = Board.deletePost(currentPost.id, user);
      if (result.success) {
        alert('게시글이 삭제되었습니다.');
        window.location.href = `board.html?type=${currentPost.boardType}`;
      } else {
        alert(result.message);
      }
    }

    // ── XSS 방지 이스케이프 ──────────────────────────
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>

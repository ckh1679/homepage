  <script>
    // ?대? 濡쒓렇?몃맂 寃쎌슦 ?덉쑝濡??대룞
    if (Auth.isLoggedIn()) {
      const redirect = new URLSearchParams(window.location.search).get('redirect');

    // ?? 援ш? 濡쒓렇??珥덇린??諛?踰꾪듉 ?뚮뜑留?????????????????
    function initGoogleAuth() {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: Auth.GOOGLE_CLIENT_ID,
          callback: handleGoogleLoginResponse,
          auto_select: false
        });

        const targetEl = document.getElementById('googleBtnWrapper');
        if (targetEl) {
          google.accounts.id.renderButton(targetEl, {
            theme: 'outline',
            size: 'large',
            type: 'standard',
            text: 'signin_with',
            shape: 'rectangular',
            logo_alignment: 'left',
            width: 320
          });
        }
      } else {
        setTimeout(initGoogleAuth, 100);
      }
    }

    // ?? 援ш? 濡쒓렇???묐떟 泥섎━ ??????????????????????????
    function handleGoogleLoginResponse(response) {
      if (!response || !response.credential) {
        alert('援ш? 濡쒓렇?몄뿉 ?ㅽ뙣?덉뒿?덈떎. ?ㅼ떆 ?쒕룄?댁＜?몄슂.');
        return;
      }

      const res = Auth.loginWithGoogle(response.credential);
      if (res.success) {
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        window.location.href = redirect ? decodeURIComponent(redirect) : 'index.html';
      } else {
        alert(res.message || '援ш? 濡쒓렇??以??ㅻ쪟媛 諛쒖깮?덉뒿?덈떎.');
      }
    }

    // 珥덇린???쒖옉
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGoogleAuth);
    } else {
      initGoogleAuth();
    }
    setTimeout(initGoogleAuth, 500);
  </script>

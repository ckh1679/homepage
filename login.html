<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 프린터모아</title>
  <meta name="description" content="프린터모아 구글 로그인 페이지">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- Google Identity Services (Google 로그인 SDK) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth.js"></script>
</head>
<body class="auth-page">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="container">
      <div class="inner">
        <div></div>
        <a href="index.html" class="logo" id="loginLogo">
          <div class="logo-text">프린터<span>모아</span></div>
        </a>
        <div class="top-phone">
          <div class="label">상담 전화</div>
          <a href="tel:01059223650" class="number">010-5922-3650</a>
        </div>
      </div>
    </div>
  </header>

  <!-- GNB -->
  <nav class="gnb">
    <div class="container">
      <div class="gnb-menu">
        <ul>
          <li><a href="index.html">홈</a></li>
          <li><a href="board/board.html?type=notice">공지사항</a></li>
          <li><a href="board/board.html?type=consult">상담게시판</a></li>
          <li><a href="board/board.html?type=review">이용후기</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <style>
    .login-page-wrap {
      min-height: calc(100vh - 200px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #f0f7ff 0%, #e8f4fd 100%);
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0,153,204,0.12);
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .login-brand {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .login-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 8px;
    }
    .login-subtitle {
      font-size: 14px;
      color: var(--gray-mid);
      margin-bottom: 32px;
      line-height: 1.7;
    }
    .google-signin-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      padding: 28px 20px;
      background: #fafafa;
      border-radius: 14px;
      border: 1px solid #eee;
    }
    .google-signin-desc {
      font-size: 12px;
      color: var(--gray-mid);
    }
    .login-security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0fff4;
      border: 1px solid #b7efc5;
      color: #2d6a4f;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 28px;
    }
    .login-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--gray-mid);
      text-decoration: none;
      transition: color 0.2s;
      margin-top: 8px;
    }
    .login-back-link:hover { color: var(--primary); }
    #googleBtnWrapper {
      min-height: 44px;
      display: flex;
      justify-content: center;
    }
  </style>

  <!-- 로그인 메인 -->
  <div class="login-page-wrap">
    <div class="login-card">

      <div class="login-brand">✨ PRINTERMOA</div>
      <h1 class="login-title">로그인</h1>
      <p class="login-subtitle">
        구글 계정으로 간편하게 로그인하세요.<br>
        별도 회원가입 없이 바로 이용 가능합니다.
      </p>

      <div class="login-security-badge">
        <i class="fa fa-shield-alt"></i> 구글 계정 전용 보안 로그인
      </div>

      <!-- 구글 로그인 버튼 영역 -->
      <div class="google-signin-area">
        <div id="googleBtnWrapper"></div>
        <p class="google-signin-desc">구글 계정으로 1초 만에 간편 로그인</p>
      </div>

      <a href="index.html" class="login-back-link" id="goHomeLink">
        <i class="fa fa-arrow-left"></i> 홈으로 돌아가기
      </a>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer" style="margin-top: 0;">
    <div class="container">
      <div class="footer-links">
        <a href="index.html" class="bold">홈</a>
        <a href="board/board.html?type=notice">공지사항</a>
        <a href="board/board.html?type=consult">상담게시판</a>
      </div>
      <p class="footer-company">프린터모아</p>
      <div class="footer-copyright">Copyright © 프린터모아. All Rights Reserved.</div>
    </div>
  </footer>

  <script>
    // 이미 로그인된 경우 홈 또는 직전 페이지로 이동
    if (Auth.isLoggedIn()) {
      const redirect = new URLSearchParams(window.location.search).get('redirect');
      window.location.href = redirect ? decodeURIComponent(redirect) : 'index.html';
    }

    // ── 구글 로그인 초기화 및 버튼 렌더링 ───────────────────
    function initGoogleAuth() {
      if (window.google && google.accounts && google.accounts.id) {
        try {
          google.accounts.id.initialize({
            client_id: Auth.GOOGLE_CLIENT_ID,
            callback: handleGoogleLoginResponse,
            auto_select: false
          });

          const targetEl = document.getElementById('googleBtnWrapper');
          if (targetEl && !targetEl.hasChildNodes()) {
            google.accounts.id.renderButton(targetEl, {
              theme: 'outline',
              size: 'large',
              type: 'standard',
              text: 'signin_with',
              shape: 'rectangular',
              logo_alignment: 'left',
              width: 300
            });
          }
        } catch (err) {
          console.error('Google Auth 초기화 에러:', err);
        }
      } else {
        setTimeout(initGoogleAuth, 150);
      }
    }

    // ── 구글 로그인 응답 처리 ─────────────────────────────
    function handleGoogleLoginResponse(response) {
      if (!response || !response.credential) {
        alert('구글 로그인 응답이 올바르지 않습니다. 다시 시도해주세요.');
        return;
      }

      const res = Auth.loginWithGoogle(response.credential);
      if (res.success) {
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        window.location.href = redirect ? decodeURIComponent(redirect) : 'index.html';
      } else {
        alert(res.message || '구글 로그인 처리 중 오류가 발생했습니다.');
      }
    }

    // 초기화 실행
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGoogleAuth);
    } else {
      initGoogleAuth();
    }
    setTimeout(initGoogleAuth, 500);
  </script>
</body>
</html>

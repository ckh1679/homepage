<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 프린터모아</title>
  <meta name="description" content="프린터모아 로그인 페이지">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- auth.js는 body 내에서 로드 (DOM보다 먼저 실행되어야 하므로) -->
  <script src="auth.js"></script>
</head>
<body class="auth-page">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="container">
      <div class="inner">
        <div></div>
        <a href="index.html" class="logo" id="loginLogo">
          <div class="logo-text">프린터<span>모아</span></div>
        </a>
        <div class="top-phone">
          <div class="label">상담 전화</div>
          <a href="tel:01059223650" class="number">010-5922-3650</a>
        </div>
      </div>
    </div>
  </header>

  <!-- GNB -->
  <nav class="gnb">
    <div class="container">
      <div class="gnb-menu">
        <ul>
          <li><a href="index.html">홈</a></li>
          <li><a href="board/board.html?type=notice">공지사항</a></li>
          <li><a href="board/board.html?type=consult">상담게시판</a></li>
          <li><a href="board/board.html?type=review">사용후기</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 로그인 폼 -->
  <main class="auth-main">
    <div class="auth-box">
      <!-- 로고 -->
      <h2>🖨️ 프린터모아 로그인</h2>
      <p class="auth-sub">회원 서비스를 이용하시려면 로그인해주세요.</p>

      <form id="loginForm" novalidate>
        <!-- 아이디 -->
        <div class="form-group">
          <label for="loginId">아이디</label>
          <input
            type="text"
            id="loginId"
            placeholder="아이디를 입력하세요"
            autocomplete="username"
            autofocus
          >
          <span class="field-msg error" id="idError" style="display:none"></span>
        </div>

        <!-- 비밀번호 -->
        <div class="form-group">
          <label for="loginPw">비밀번호</label>
          <input
            type="password"
            id="loginPw"
            placeholder="비밀번호를 입력하세요"
            autocomplete="current-password"
          >
          <span class="field-msg error" id="pwError" style="display:none"></span>
        </div>

        <!-- 전체 에러 메시지 -->
        <span class="field-msg error" id="loginError" style="display:none; margin-bottom: 12px;"></span>

        <!-- 로그인 버튼 -->
        <button type="submit" class="auth-submit-btn" id="loginSubmitBtn">
          <i class="fa fa-sign-in-alt"></i> 로그인
        </button>
      </form>

      <div class="auth-divider">또는</div>

      <!-- 하단 링크 -->
      <div class="auth-footer-links">
        아직 회원이 아니신가요?
        <a href="register.html" id="goRegisterLink">회원가입</a>
      </div>
      <div class="auth-footer-links" style="margin-top:10px;">
        <a href="index.html" id="goHomeLink">← 홈으로 돌아가기</a>
      </div>

      <!-- 테스트 안내 (관리자 계정) -->
      <div style="margin-top:24px; padding:14px; background:#f0f7ff; border-radius:8px; border:1px solid #cce5ff;">
        <p style="font-size:12px; color:#0066aa; font-weight:600; margin-bottom:6px;">
          🔑 테스트 계정 안내
        </p>
        <p style="font-size:12px; color:#555; line-height:1.8;">
          관리자: <strong>admin</strong> / <strong>admin1234</strong>
        </p>
      </div>
    </div>
  </main>

  <script>
    // 이미 로그인된 경우 홈으로 이동
    if (Auth.isLoggedIn()) {
      window.location.href = 'index.html';
    }

    // 로그인 폼 제출 처리
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const id = document.getElementById('loginId').value.trim();
      const pw = document.getElementById('loginPw').value;
      const errEl = document.getElementById('loginError');

      // 기존 에러 숨기기
      errEl.style.display = 'none';

      if (!id) {
        document.getElementById('idError').textContent = '아이디를 입력해주세요.';
        document.getElementById('idError').style.display = 'block';
        document.getElementById('loginId').focus();
        return;
      }

      if (!pw) {
        document.getElementById('pwError').textContent = '비밀번호를 입력해주세요.';
        document.getElementById('pwError').style.display = 'block';
        document.getElementById('loginPw').focus();
        return;
      }

      // 에러 메시지 초기화
      document.getElementById('idError').style.display = 'none';
      document.getElementById('pwError').style.display = 'none';

      const result = Auth.login(id, pw);
      if (result.success) {
        // 로그인 성공 - 이전 페이지 또는 홈으로 이동
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        window.location.href = redirect || 'index.html';
      } else {
        errEl.textContent = result.message;
        errEl.style.display = 'block';
        document.getElementById('loginPw').value = '';
        document.getElementById('loginPw').focus();
      }
    });

    // 입력 시 에러 메시지 초기화
    document.getElementById('loginId').addEventListener('input', () => {
      document.getElementById('idError').style.display = 'none';
    });
    document.getElementById('loginPw').addEventListener('input', () => {
      document.getElementById('pwError').style.display = 'none';
    });
  </script>
</body>
</html>
